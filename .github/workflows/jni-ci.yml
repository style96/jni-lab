name: JNI Samples CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --enable=warning --inconclusive --error-exitcode=1 --std=c++17
          -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux"
          hello_world array_sum string_exchange struct_pass

  build-samples:
    needs: static-analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [hello_world, string_exchange, array_sum, struct_pass]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build ${{ matrix.sample }} sample
        working-directory: ${{ matrix.sample }}
        run: |
          chmod +x build.sh
          ./build.sh
